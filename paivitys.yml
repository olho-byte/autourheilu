name: Päivitä Runki.fi videot

on:
  schedule:
    # Kellonajat (UTC): 03:30 (Suomi 05:30), 10:06 (Suomi 12:06), 15:06 (Suomi 17:06)
    - cron: '30 3 * * *'
    - cron: '6 10 * * *'
    - cron: '6 15 * * *'
  workflow_dispatch: # Manuaalinen käynnistysnappi

permissions:
  contents: write # Tämä antaa luvan tallentaa index.html

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Lataa sivuston tiedostot
        uses: actions/checkout@v4

      - name: 🐍 Asenna Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Asenna kirjastot
        run: |
          pip install google-api-python-client jinja2

      - name: 🚀 Aja sivuston luonti
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python luo_sivusto.py

      - name: 💾 Tallenna muutokset
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add index.html kalenteri.html
          git commit -m "🤖 Automaattinen päivitys" || echo "Ei uusia videoita tallennettavaksi"
          git push