name: Päivitä Runki.fi videot

on:
  schedule:
    # Ajat ovat UTC-ajassa (Suomen aika -2h)
    - cron: '30 3 * * *'   # Klo 05:30 Suomen aikaa
    - cron: '30 8 * * *'   # Klo 10:30 Suomen aikaa (TÄSTÄ NÄET TOIMIIKO NYT)
    - cron: '6 10 * * *'   # Klo 12:06 Suomen aikaa
    - cron: '6 15 * * *'   # Klo 17:06 Suomen aikaa
  
  workflow_dispatch: # Mahdollistaa päivityksen käynnistämisen napista manuaalisesti

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Lataa sivuston tiedostot (Checkout)
        uses: actions/checkout@v4

      - name: 🐍 Asenna Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Asenna kirjastot
        run: |
          pip install -r requirements.txt

      - name: 🚀 Aja sivuston luonti (Python)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python luo_sivusto.py

      - name: 💾 Tallenna ja lähetä muutokset (Commit & Push)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Robotti päivitti videot ja kalenterin"
          file_pattern: "*.html"